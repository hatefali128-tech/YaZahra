<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* فونت‌های پروژه */
        @font-face {
            font-family: 'NoorZar';
            src: url('file:///data/data/ir.fena.quran.arshad.yazahra/files/fonts/noorzar.ttf');
        }
        @font-face {
            font-family: 'NoorLotus';
            src: url('file:///data/data/ir.fena.quran.arshad.yazahra/files/fonts/noorlotus.ttf');
        }
        @font-face {
            font-family: 'Scheherazade';
            src: url('file:///data/data/ir.fena.quran.arshad.yazahra/files/fonts/scheherazade.ttf');
        }
        @font-face {
            font-family: 'Amiri';
            src: url('file:///data/data/ir.fena.quran.arshad.yazahra/files/fonts/amiri.ttf');
        }
        @font-face {
            font-family: 'Taha';
            src: url('file:///data/data/ir.fena.quran.arshad.yazahra/files/fonts/taha.ttf');
        }
        @font-face {
            font-family: 'FontAwesome';
            src: url('file:///data/data/ir.fena.quran.arshad.yazahra/files/fonts/fontawesome.ttf');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            border: none;
        }

        body {
            /* پس‌زمینه واقعاً تاریک با گرادیانت متحرک ساده و کم‌حجم */
            background: linear-gradient(135deg, #000000, #0d0d0d, #1a1a1a, #0d0d0d, #000000);
            background-size: 300% 300%;
            animation: darkShift 20s ease infinite;
            color: #e0e0e0;
            text-align: center;
            padding: 16px;
            font-family: 'NoorZar', serif;
            min-height: 100vh;
        }

        @keyframes darkShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* کارت گروه بدون هیچ حاشیه‌ای */
        .group-card {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            outline: none;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .ayah {
            padding: 12px 10px;
            line-height: 2.2;
            transition: all 0.3s ease;
            position: relative;
            border: none;
            outline: none;
            border-bottom: none;  /* حذف کامل خط جداکننده */
        }

        .ayah:last-child {
            border-bottom: none;
        }

        .ayah.active {
            font-weight: bold;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: none;
            outline: none;
            text-shadow:
                0 0 15px rgba(255, 255, 255, 0.8),
                0 0 30px rgba(100, 200, 255, 0.4);
            box-shadow: none;  /* هیچ حاشیه‌ای */
        }

        .ayah-num {
            font-size: 12px;
            color: #b0b0b0;
            margin-top: 6px;
            font-family: 'NoorLotus', sans-serif;
        }

        .translation {
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            line-height: 1.8;
            font-family: 'NoorLotus', sans-serif;
            color: #d0d0d0;
            text-align: center;
        }

        /* قلب با فونت‌اوسام */
        .favorite-heart {
            display: inline-block;
            margin-top: 8px;
            font-family: 'FontAwesome';
            font-size: 18px;
            cursor: pointer;
            color: #555;
            user-select: none;
            transition: color 0.3s ease, transform 0.2s ease;
            border: none;
            outline: none;
        }

        .favorite-heart.liked {
            color: #ff4d6d;
        }

        .favorite-heart:hover {
            transform: scale(1.2);
        }

        .favorite-heart::before {
            content: '\f004';
        }

        .tafsir-toggle {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 20px;
            background: transparent;
            color: #ffffff;
            border: none;
            outline: none;
            cursor: pointer;
            text-decoration: none;
            font-family: 'NoorLotus', sans-serif;
            font-size: 14px;
            transition: background 0.3s, color 0.3s;
        }

        .tafsir-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .tafsir-content {
            display: none;
            background: rgba(255, 255, 255, 0.03);
            border: none;
            border-radius: 6px;
            padding: 12px;
            margin-top: 8px;
            font-size: 14px;
            color: #e0e0e0;
            text-align: justify;
            line-height: 1.8;
            font-family: 'NoorLotus', sans-serif;
        }

        .group-separator {
            height: 0;
            border: none;
            border-bottom: none;  /* حذف هر گونه خط */
            margin: 16px 0;
        }
    </style>
</head>
<body>
<div id="quran-container"></div>
<script>
    function renderQuran(groups, showTranslation, fontFamily, translationFont, tafsirFont,
                          fontSize, transSize, tafsirSize) {
        var c = document.getElementById('quran-container');
        if (!c) return;
        c.innerHTML = '';
        groups.forEach(function(g, groupIndex) {
            var card = document.createElement('div');
            card.className = 'group-card';

            g.verses.forEach(function(v) {
                var a = document.createElement('div');
                a.className = 'ayah';
                a.id = 'ayah-' + v.surahId + '-' + v.categoryId;
                a.innerText = v.title;
                a.style.fontFamily = fontFamily;
                a.style.fontSize = fontSize + 'px';
                a.ondblclick = function() { Android.playFromAyah(v.surahId, v.categoryId); };

                if (showTranslation && v.translation) {
                    var trans = document.createElement('div');
                    trans.className = 'translation';
                    trans.innerText = v.translation;
                    trans.style.fontFamily = translationFont;
                    trans.style.fontSize = transSize + 'px';
                    a.appendChild(trans);
                }

                var num = document.createElement('div');
                num.className = 'ayah-num';
                num.innerHTML = '﴿' + v.ayahNumber + ' از ' + v.ayahCount + ' ' + v.surahName + ' - صفحه ' + v.pageId + '﴾';
                num.style.fontFamily = translationFont;
                num.style.fontSize = (transSize - 2) + 'px';
                a.appendChild(num);

                var heart = document.createElement('span');
                heart.className = 'favorite-heart' + (v.favorite ? ' liked' : '');
                heart.id = 'heart-' + v.surahId + '-' + v.categoryId;
                heart.onclick = function() { Android.toggleFavorite(v.surahId, v.categoryId); };
                a.appendChild(heart);

                card.appendChild(a);
            });

            if (g.tafsir) {
                var toggle = document.createElement('span');
                toggle.className = 'tafsir-toggle';
                toggle.innerText = 'تفسیر';
                toggle.onclick = function() {
                    var content = this.nextElementSibling;
                    if (content.style.display === 'none' || content.style.display === '') {
                        content.style.display = 'block';
                        Android.showTafsir(g.tafsir);
                    } else {
                        content.style.display = 'none';
                    }
                };
                card.appendChild(toggle);
                var tafsirDiv = document.createElement('div');
                tafsirDiv.className = 'tafsir-content';
                tafsirDiv.innerText = g.tafsir;
                tafsirDiv.style.fontFamily = tafsirFont;
                tafsirDiv.style.fontSize = tafsirSize + 'px';
                card.appendChild(tafsirDiv);
            }

            if (groupIndex < groups.length - 1) {
                var sep = document.createElement('div');
                sep.className = 'group-separator';
                card.appendChild(sep);
            }

            c.appendChild(card);
        });
    }

    function highlightAyah(surahId, categoryId) {
        var all = document.querySelectorAll('.ayah');
        all.forEach(function(el) { el.classList.remove('active'); });
        var target = document.getElementById('ayah-' + surahId + '-' + categoryId);
        if (target) {
            target.classList.add('active');
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function setHeartState(surahId, categoryId, isFavorite) {
        var heart = document.getElementById('heart-' + surahId + '-' + categoryId);
        if (heart) {
            if (isFavorite) {
                heart.classList.add('liked');
            } else {
                heart.classList.remove('liked');
            }
        }
    }
</script>
</body>
</html>
